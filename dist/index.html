    /*  Spinner  */
    .Spinner {
      border: 4px solid rgba(255, 255, 255, 0.093);
      /* Light white semi-transparent border */
      border-top: 4px solid rgba(255, 255, 255, 0.708);
      /* Solid white for the spinning part */
      border-radius: 50%;
      width: 36px;
      /* Adjust size */
      height: 36px;
      /* Adjust size */
      animation: spin 1s linear infinite;
      /* Smooth spinning animation */
      margin: 2rem auto 2rem auto;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
